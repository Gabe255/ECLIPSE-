name: ECLIPSE First Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eclipse-first-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, verify, and publish Android APKs
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: migration/pegasus-flutter-port

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Restore and validate original ECLIPSE signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Required signing secret $name is missing."
              exit 1
            fi
          done
          mkdir -p android
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.jks
          test -s android/release.jks
          keytool -list -keystore android/release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Original ECLIPSE signing certificate validated."

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run release gates
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          dart test test_pure
          flutter test

      - name: Build ARM release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PATH: release.jks
        run: bash build-utils/build-android.sh

      - name: Verify APK package and signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$APKANALYZER"
          shopt -s nullglob
          APKS=(release/eclipse-android-*.apk)
          test "${#APKS[@]}" -eq 2
          for APK in "${APKS[@]}"; do
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            "$APKANALYZER" manifest application-id "$APK" | grep -Fxq com.eclipse.launcher
            sha256sum "$APK"
          done

      - name: Upload installable APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ECLIPSE-first-release-APKs
          path: release/eclipse-android-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish browser-downloadable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="eclipse-first-release-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/eclipse-android-*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "ECLIPSE First Release Candidate #${GITHUB_RUN_NUMBER}" \
            --notes "Installable ARM APKs built from ${GITHUB_SHA}. Original ECLIPSE signing certificate validated; APK signatures and application ID verified. This is a prerelease candidate." \
            --prerelease