name: Format ECLIPSE frontend work

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-eclipse-final.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Format changed Dart files
        run: |
          flutter pub get --enforce-lockfile
          dart format \
            lib/screens/systems_screen/my_systems_section/eclipse_platform_card.dart \
            lib/screens/systems_screen/my_systems_section/eclipse_platform_shelf.dart \
            lib/screens/systems_screen/my_systems_section/my_systems_grid.dart \
            lib/screens/systems_screen/console_experience_screen.dart \
            lib/screens/systems_screen/system_details_card/system_details.dart \
            lib/screens/settings_screen/new_settings_options/general_settings_content.dart \
            lib/screens/settings_screen/new_settings_options/about_settings_content.dart \
            lib/screens/secondary_screen/secondary_screen.dart \
            lib/widgets/setup_wizard.dart \
            lib/widgets/splash_status_layout.dart \
            lib/screens/app_screen.dart \
            lib/providers/wallpaper_provider.dart \
            lib/data/datasources/sqlite_service.dart \
            lib/data/datasources/sqlite_migrations.dart \
            lib/services/log_export_service.dart \
            lib/services/retro_achievements_service.dart \
            lib/services/ra_catalogue_service.dart \
            lib/sync/providers/neo_sync_adapter.dart \
            lib/l10n/app_locale.dart \
            lib/l10n/app_locale_en.dart \
            lib/l10n/app_locale_es.dart \
            lib/l10n/app_locale_ru.dart \
            lib/l10n/app_locale_zh.dart \
            lib/l10n/app_locale_zh_hant.dart \
            lib/l10n/app_locale_pt.dart \
            lib/l10n/app_locale_fr.dart \
            lib/l10n/app_locale_de.dart \
            lib/l10n/app_locale_it.dart \
            lib/l10n/app_locale_id.dart \
            lib/l10n/app_locale_ja.dart \
            lib/l10n/app_locale_ko.dart
      - name: Commit formatting and remove workflow
        run: |
          rm .github/workflows/format-eclipse-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib .github/workflows/format-eclipse-final.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format ECLIPSE frontend and rebrand changes"
            git pull --rebase origin main
            git push
          else
            git commit --allow-empty -m "chore: complete ECLIPSE format pass"
            git pull --rebase origin main
            git push
          fi
