name: ECLIPSE Android Preview

on:
  push:
    branches:
      - migration/pegasus-flutter-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build signed Android APKs
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache Gradle and pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-eclipse-android-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-eclipse-android-

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Create .env from secrets
        shell: bash
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          : > .env
          [ -n "$SCREENSCRAPER_DEV_ID" ] && echo "SCREENSCRAPER_DEV_ID=$SCREENSCRAPER_DEV_ID" >> .env
          [ -n "$SCREENSCRAPER_DEV_PASSWORD" ] && echo "SCREENSCRAPER_DEV_PASSWORD=$SCREENSCRAPER_DEV_PASSWORD" >> .env

      - name: Validate original Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Required Android signing secret $name is missing."
              exit 1
            fi
          done
          mkdir -p android
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.jks
          test -s android/release.jks
          keytool -list -keystore android/release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Original release keystore validated."

      - name: Build signed ARM APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PATH: release.jks
        run: bash build-utils/build-android.sh

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: eclipse-android-apks
          path: release/eclipse-android-*.apk
          if-no-files-found: error
          retention-days: 14
