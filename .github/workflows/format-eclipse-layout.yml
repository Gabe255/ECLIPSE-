name: Format ECLIPSE layout changes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-eclipse-layout.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Format changed Dart files
        run: |
          flutter pub get --enforce-lockfile
          dart format \
            lib/main.dart \
            lib/models/config_model.dart \
            lib/data/datasources/sqlite_config_service.dart \
            lib/data/datasources/sqlite_service.dart \
            lib/screens/app_screen.dart \
            lib/screens/game_screen/my_games_carousel.dart \
            lib/screens/systems_screen/console_experience_screen.dart \
            lib/screens/systems_screen/my_systems_section/my_systems_grid.dart \
            lib/screens/systems_screen/my_systems_section/eclipse_platform_shelf.dart \
            lib/screens/systems_screen/my_systems_section/widgets/system_options_dialog.dart \
            lib/screens/settings_screen/new_settings_options/general_settings_content.dart \
            lib/providers/wallpaper_provider.dart \
            lib/themes/eclipse_theme.dart
      - name: Commit formatting and remove one-time workflow
        run: |
          rm .github/workflows/format-eclipse-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib .github/workflows/format-eclipse-layout.yml
          git commit -m "style: format ECLIPSE shelf and layout options"
          git pull --rebase origin main
          git push
