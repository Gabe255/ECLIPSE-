name: Format ECLIPSE development branch

on:
  push:
    branches:
      - feature/eclipse-native-console-rebuild

permissions:
  contents: write

concurrency:
  group: eclipse-dart-format
  cancel-in-progress: true

jobs:
  format:
    if: github.repository == 'Gabe255/ECLIPSE-'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/eclipse-native-console-rebuild
          persist-credentials: true
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Format changed ECLIPSE files
        run: >-
          dart format
          lib/models/eclipse_experience_catalog.dart
          lib/screens/app_screen.dart
          lib/screens/eclipse_home_screen.dart
          lib/widgets/eclipse_experience_switcher.dart
          test/check_systems_updates_setting_test.dart
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/models/eclipse_experience_catalog.dart lib/screens/app_screen.dart lib/screens/eclipse_home_screen.dart lib/widgets/eclipse_experience_switcher.dart test/check_systems_updates_setting_test.dart
            git commit -m "style: format ECLIPSE experience implementation"
            git push origin HEAD:feature/eclipse-native-console-rebuild
          fi
