name: Format ECLIPSE settings shell

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-settings-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Format settings shell
        run: |
          flutter pub get --enforce-lockfile
          dart format lib/screens/settings_screen/new_settings_screen.dart
      - name: Commit formatting and remove workflow
        run: |
          rm .github/workflows/format-settings-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/settings_screen/new_settings_screen.dart .github/workflows/format-settings-once.yml
          git commit -m "style: format ECLIPSE settings shell"
          git pull --rebase origin main
          git push
