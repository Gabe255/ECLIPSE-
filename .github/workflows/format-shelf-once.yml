name: Format ECLIPSE library rows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-shelf-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Format ECLIPSE library rows
        run: |
          flutter pub get --enforce-lockfile
          dart format \
            lib/screens/systems_screen/my_systems_section/eclipse_platform_card.dart \
            lib/screens/systems_screen/my_systems_section/eclipse_platform_shelf.dart
      - name: Commit formatting and remove workflow
        run: |
          rm .github/workflows/format-shelf-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/systems_screen/my_systems_section/eclipse_platform_card.dart lib/screens/systems_screen/my_systems_section/eclipse_platform_shelf.dart .github/workflows/format-shelf-once.yml
          git commit -m "style: format ECLIPSE library rows"
          git pull --rebase origin main
          git push
