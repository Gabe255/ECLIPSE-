name: One-time Dart formatting repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
      - name: Format the files flagged by CI and remove this temporary workflow
        run: |
          set -euo pipefail
          dart format lib/screens/systems_screen/console_experience_screen.dart lib/screens/systems_screen/my_systems_section/my_systems_grid.dart
          rm .github/workflows/format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/systems_screen/console_experience_screen.dart lib/screens/systems_screen/my_systems_section/my_systems_grid.dart .github/workflows/format-once.yml
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git commit -m "style: format console experience and systems grid"
          git push origin main
